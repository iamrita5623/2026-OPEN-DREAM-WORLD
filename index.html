<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢想音樂節 - 超級搖滾區座位雷達</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .header { margin-bottom: 20px; }
        .search-box { background: #2a2a2a; padding: 15px; border-radius: 8px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select { padding: 8px; font-size: 16px; margin-right: 15px; border-radius: 4px; background: #fff; border: 1px solid #444; font-weight: bold; }
        input { padding: 8px; font-size: 16px; width: 60px; margin: 0 10px; border: 1px solid #444; border-radius: 4px; background: #fff; text-align: center; }
        button { padding: 8px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        
        /* 測距儀結果顯示框 */
        #resultBox { display: none; margin-top: 15px; padding: 15px; background-color: #1e1e1e; border-radius: 8px; font-size: 16px; color: #00FF00; border: 1px solid #00FF00; line-height: 1.8; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; }
        .highlight-text { color: #FFD700; font-weight: bold; font-size: 18px; }
        .advice-item { display: block; margin-top: 8px; padding-left: 5px; color: #fff; }
        
        .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; font-size: 14px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 16px; height: 16px; border-radius: 3px; }
        
        .map-container { overflow-x: auto; padding-bottom: 20px; white-space: nowrap; text-align: left; display: inline-block; }
        .seat-map { display: inline-block; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        
        .row { display: flex; margin-bottom: 4px; }
        .row-label { width: 50px; text-align: right; margin-right: 15px; font-size: 12px; line-height: 20px; color: #aaa; flex-shrink: 0; }
        
        .seat { width: 20px; height: 20px; border-radius: 4px; font-size: 9px; line-height: 20px; text-align: center; cursor: pointer; position: relative; box-sizing: border-box; }
        
        /* 極簡化顏色設定 + 櫻花粉色 */
        .zone-default { background-color: #e0e0e0; color: #000; }
        .zone-new { background-color: #ffb3ba; color: #000; } 
        .zone-gray { background-color: #444444; color: #999; } 
        
        /* 搜尋特效 */
        .highlight { box-shadow: 0 0 15px 5px #00FF00; border: 2px solid #00FF00; transform: scale(1.3); z-index: 10; animation: pulse 1s infinite alternate; background-color: #00FF00; color: #000; font-weight: bold; }
        
        @keyframes pulse {
            from { box-shadow: 0 0 10px #00FF00; }
            to { box-shadow: 0 0 20px 10px #00FF00; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>
            夢想音樂節 - <span style="color: #FF4C4C;">超級搖滾區 (1~24排)</span> 座位查詢
            <div style="font-size: 15px; color: #f39c12; font-weight: normal; margin-top: 10px;">
                (※ 僅收錄 1~24 排。座位圖與測距儀僅供參考，實際排法請以現場為準)
            </div>
        </h2>
        <div class="search-box">
            <select id="layoutSelect" onchange="buildMap()">
                <option value="decreasing">1. 遞減排法 </option>
                <option value="10x10">2. 10x10排法 </option>
            </select>
            <label>第 <input type="number" id="inputRow" min="1" max="24" placeholder="排"> 排</label>
            <label>第 <input type="number" id="inputSeat" min="1" max="108" placeholder="號"> 號</label>
            <button onclick="findSeat()">鎖定座位</button>
            
            <!-- 距離結果顯示區 -->
            <div id="resultBox"></div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background-color: #e0e0e0;"></div>共同開賣區域 (21~88)</div>
        <div class="legend-item"><div class="color-box" style="background-color: #ffb3ba;"></div>12/4 加開區域 (15~20, 89~94)</div>
        <div class="legend-item"><div class="color-box" style="background-color: #444444;"></div>尚未販售區域 (1~14, 95~108)</div>
    </div>

    <div class="map-container">
        <div class="seat-map" id="seatMap">
            <!-- JavaScript 會在這裡自動畫出座位 -->
        </div>
    </div>

    <script>
        const totalRows = 24;
        const totalSeats = 108;
        const horizontalAisles = [10, 20];
        const centerAisle = 54;

        function getBlockWidth(start, end, aisles) {
            if (start > end) return 0;
            let width = 0;
            for(let i=start; i<=end; i++) {
                width += 20;
                if (i !== end) {
                    width += 2;
                    if (i === centerAisle) width += 30;
                    else if (aisles.includes(i)) width += 15;
                }
            }
            return width;
        }

        function getMarginAfter(seat, aisles) {
            if (seat === totalSeats) return 0;
            let m = 2;
            if (seat === centerAisle) m += 30;
            else if (aisles.includes(seat)) m += 15;
            return m;
        }

        function buildMap() {
            const layout = document.getElementById('layoutSelect').value;
            const mapDiv = document.getElementById('seatMap');
            mapDiv.innerHTML = '';
            document.getElementById('resultBox').style.display = 'none';

            let verticalAisles = [];
            let stageConfigs = [];

            if (layout === 'decreasing') {
                verticalAisles = [15, 29, 42, 66, 79, 93];
                stageConfigs = [
                    {type: 'empty', range: [1, 24]},
                    {type: 'led', range: [25, 39]},
                    {type: 'main', range: [40, 69]},
                    {type: 'led', range: [70, 84]},
                    {type: 'empty', range: [85, 108]}
                ];
            } else {
                verticalAisles = [4, 14, 24, 34, 44, 64, 74, 84, 94, 104];
                stageConfigs = [
                    {type: 'empty', range: [1, 24]},
                    {type: 'led', range: [25, 39]},
                    {type: 'main', range: [40, 69]},
                    {type: 'led', range: [70, 84]},
                    {type: 'empty', range: [85, 108]}
                ];
            }

            let stageHtml = '<div class="row" style="margin-bottom: 25px; font-weight: bold; text-align: center; line-height: 30px; font-size: 14px;">';
            stageHtml += '<div class="row-label">舞台區</div>';
            stageConfigs.forEach(c => {
                let w = getBlockWidth(c.range[0], c.range[1], verticalAisles);
                let m = getMarginAfter(c.range[1], verticalAisles);
                if (c.type === 'empty') {
                    stageHtml += `<div style="width: ${w}px; margin-right: ${m}px;"></div>`;
                } else if (c.type === 'led') {
                    stageHtml += `<div style="width: ${w}px; margin-right: ${m}px; background-color: #4a90e2; color: #fff; border-radius: 4px; box-shadow: 0 0 10px #4a90e2;">轉播螢幕</div>`;
                } else if (c.type === 'main') {
                    stageHtml += `<div style="width: ${w}px; margin-right: ${m}px; background-color: #f39c12; color: #fff; border-radius: 4px; box-shadow: 0 0 15px #f39c12;">主舞台</div>`;
                }
            });
            stageHtml += '</div>';
            mapDiv.innerHTML += stageHtml;

            for (let r = 1; r <= totalRows; r++) {
                let rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                if (horizontalAisles.includes(r - 1)) rowDiv.style.marginTop = '20px';
                
                let label = document.createElement('div');
                label.className = 'row-label';
                label.innerText = `第 ${r} 排`;
                rowDiv.appendChild(label);

                for (let s = 1; s <= totalSeats; s++) {
                    let seatDiv = document.createElement('div');
                    
                    let zoneClass = 'zone-default';
                    if (s <= 14 || s >= 95) {
                        zoneClass = 'zone-gray';
                    } else if ((s >= 15 && s <= 20) || (s >= 89 && s <= 94)) {
                        zoneClass = 'zone-new';
                    }
                    
                    seatDiv.className = `seat ${zoneClass}`;
                    seatDiv.id = `seat-${r}-${s}`;
                    seatDiv.innerText = s;
                    seatDiv.style.marginRight = getMarginAfter(s, verticalAisles) + 'px';
                    rowDiv.appendChild(seatDiv);
                }
                mapDiv.appendChild(rowDiv);
            }
        }

        function findSeat() {
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';

            const rStr = document.getElementById('inputRow').value;
            const sStr = document.getElementById('inputSeat').value;
            
            if (rStr && sStr) {
                const r = parseInt(rStr);
                const s = parseInt(sStr);
                const target = document.getElementById(`seat-${r}-${s}`);
                const layout = document.getElementById('layoutSelect').value;
                
                if (target) {
                    target.classList.add('highlight');
                    target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });

                    let v_aisles = layout === 'decreasing' ? [15, 29, 42, 66, 79, 93] : [4, 14, 24, 34, 44, 64, 74, 84, 94, 104];
                    
                    // Y軸距離 (深度)
                    let y = 3 + (r - 1) * 0.9;
                    if (r > 10) y += 2; 
                    if (r > 20) y += 2; 

                    // X軸距離 (橫向偏差)
                    let x = 0;
                    if (s <= 54) {
                        for (let i = s; i < 54; i++) {
                            x += 0.5; 
                            if (v_aisles.includes(i)) x += 1.0; 
                        }
                        x += 0.25; 
                    } else if (s >= 55) {
                        for (let i = 55; i < s; i++) {
                            x += 0.5;
                            if (v_aisles.includes(i)) x += 1.0;
                        }
                        x += 0.25;
                    }
                    if (s !== 54 && s !== 55) x += 1.0; 

                    // 1. 計算直線距離 (畢氏定理)
                    let distance = Math.sqrt(x*x + y*y);
                    
                    // 2. 計算偏斜視角 (三角函數 arctan)
                    let angle = Math.atan(x / y) * (180 / Math.PI);

                    // --- 距離評價 (裝備建議) ---補回這段！
                    let distComment = "";
                    if (distance <= 15) {
                        distComment = "🔥 <b>距離評估：</b>神仙距離！肉眼直視毫無壓力，連汗珠都看得到。";
                    } else if (distance <= 25) {
                        distComment = "👀 <b>距離評估：</b>視野極佳！能清楚看見全身動作，手機錄影也清晰。";
                    } else if (distance <= 35) {
                        distComment = "📷 <b>距離評估：</b>距離適中！建議帶雙筒望遠鏡看特寫，或用旗艦手機變焦。";
                    } else {
                        distComment = "🔭 <b>距離評估：</b>偏後方或邊疆側！大砲鏡頭、望遠鏡、旗艦神機必備。";
                    }
                    
                    // 判斷該座位是否在「主舞台」的正前方範圍內
                    let isMainStage = (layout === 'decreasing' && s >= 43 && s <= 66) ||
                    
                    // --- 角度評價 (視角舒適度) ---
                    let angleComment = "";
                    
                    if (isMainStage) {
                        // 【主舞台範圍內】特權判定
                        if (angle <= 20) {
                            angleComment = "👑 <b>視角舒適度：</b>正C位神角 (完全正對中心，最頂視角)";
                        } else {
                            angleComment = "🤩 <b>視角舒適度：</b>主舞台前方 (雖不在正中，但正對主舞台，神仙位！)";
                        }
                    } else {
                        // 【非主舞台範圍】嚴格判定偏角
                        if (angle <= 20) {
                            angleComment = "👑 <b>視角舒適度：</b>完美正視角 (幾乎正對舞台，脖子超輕鬆)";
                        } else if (angle <= 35) {
                            angleComment = "👀 <b>視角舒適度：</b>舒適微側 (視野自然，稍轉頭即可)";
                        } else if (angle <= 50) {
                            angleComment = "📐 <b>視角舒適度：</b>偏斜視角 (斜角稍大，可能會有部分音響死角)";
                        } else {
                            angleComment = "⚠️ <b>視角舒適度：</b>極斜邊疆 (非常側邊，看轉播大螢幕機率高)";
                        }
                    }

                    // 顯示最終測距與視角結果
                    resultBox.innerHTML = `
                        📍 座位：<span style="color:#fff;">第 ${r} 排，第 ${s} 號</span><br>
                        📏 直線距離：<span class="highlight-text">${distance.toFixed(1)} 公尺</span><br>
                        📐 舞台偏角：<span class="highlight-text">${angle.toFixed(1)} 度</span><br>
                        <hr style="border-color: #333; margin: 10px 0;">
                        💡 <b>AI 專業觀影建議：</b><br>
                        <span class="advice-item">${distComment}</span>
                        <span class="advice-item">${angleComment}</span>
                    `;
                    resultBox.style.display = 'block';

                } else {
                    alert("找不到該座位！請確認排數(1-24)與號碼(1-108)。");
                }
            }
        }

        window.onload = buildMap;
    </script>
</body>
</html>
